{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Pagos</title>

    <!-- Estilos globales -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">


    <!-- Estilos específicos por app -->
    {% if current_app %}
        <link rel="stylesheet" href="{% static current_app|add:'/css/'|add:current_app|add:'.css' %}">
    {% endif %}
</head>
<body>
    <div class="contenedorPrincipal">
        <header class="contenedorPrincipal__encabezado">
            <h1 class="contenedorPrincipal__encabezado__titulo">Inicio</h1> 
            <img src="{% static 'icons/cerrar-sesion.png' %}" alt="cerrar sesion" class="contenedorPrincipal__encabezado__icono-cerrar-sesion">   
        </header>

        <div class="contenedorPrincipal__contenidoPrincipal">
            {% block content %}{% endblock %}
        </div>
        
        <footer class="contenedorPrincipal__piePagina">v_1.0.0 </footer>
    </div>
    

    <!-- Scripts globales -->
    <script src="{% static 'js/scripts.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Scripts específicos por app -->
    {% if current_app %}
        <script src="{% static current_app|add:'/js/'|add:current_app|add:'.js' %}"></script>
    {% endif %}

    <!-- Mensajes de Django con SweetAlert2 -->
    {% if messages %}
        {% for message in messages %}
            <script>
                Swal.fire({
                    icon: '{{ message.tags }}' === 'success'
                        ? 'success'
                        : 'error',
                    title: '{{ message.tags }}' === 'success'
                        ? 'Registro exitoso'
                        : 'Error al registrar',
                    text: '{{ message|escapejs }}',
                    confirmButtonText: 'Aceptar',
                    confirmButtonColor: '#3085d6'
                });
            </script>
        {% endfor %}
    {% endif %}
</body>
</html>
